<!doctype html>
<html lang="en" class="vfd-intro-pending">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Dimension Eight Labs builds open source software, firmware, and embedded systems.">
    <title>Dimension Eight Labs</title>
    <script>
      (() => {
        const storageKey = "dim8labs_intro_seen";
        const forceIntro = new URLSearchParams(window.location.search).get("intro") === "1";
        let redirecting = false;

        try {
          redirecting = !forceIntro && window.localStorage.getItem(storageKey) === "1";
        } catch {
          // Storage can be unavailable in privacy-restricted contexts. In that
          // case, allow the intro to run rather than blocking the site.
        }

        window.dim8IntroConfig = { storageKey, forceIntro, redirecting };
        if (redirecting) window.location.replace("/portfolio/");
      })();
    </script>
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="stylesheet" href="css/main.css?v=intro-runtime-2">
    <script>
      window.dim8IntroFallbackTimer = window.setTimeout(() => {
        window.location.replace("/portfolio/");
      }, 2000);
    </script>
    <noscript>
      <meta http-equiv="refresh" content="0; url=/portfolio/">
    </noscript>
    <script src="js/main.js?v=intro-runtime-3" defer></script>
  </head>
  <body>
    <main>
      <figure class="logo-frame">
        <img
          class="logo"
          src="images/dim8-vfd-logo.png"
          alt="DIM8 vacuum fluorescent display logo"
        >
      </figure>
      <h1 class="dim8labstext">Dimension Eight Labs</h1>
      <p class="tagline">Open source software, firmware, and embedded systems.</p>
    </main>

    <div class="vfd-startup" data-vfd-startup style="--text-reveal-edge: 24%; --cursor-edge: 25%;">
      <div class="vfd-startup__display" aria-hidden="true">
        <div class="logo-frame vfd-startup__frame">
          <img class="logo vfd-startup__logo vfd-startup__logo--off" src="images/dim8-vfd-logo.png" alt="">
          <img class="logo vfd-startup__logo vfd-startup__logo--partial-a" src="images/dim8-vfd-logo.png" alt="">
          <img class="logo vfd-startup__logo vfd-startup__logo--partial-b" src="images/dim8-vfd-logo.png" alt="">
          <img class="logo vfd-startup__logo vfd-startup__logo--lit" src="images/dim8-vfd-logo.png" alt="">
          <img class="logo vfd-startup__logo vfd-startup__logo--mark" src="images/dim8-vfd-logo.png" alt="">
          <img class="logo vfd-startup__logo vfd-startup__logo--text" src="images/dim8-vfd-logo.png" alt="">
          <span class="vfd-startup__cursor" aria-hidden="true"></span>
          <div class="vfd-startup__heaters">
            <span></span>
            <span></span>
            <span></span>
          </div>
        </div>
      </div>
      <a class="vfd-startup__skip" href="/portfolio/" data-vfd-startup-skip>SKIP INTRO →</a>
    </div>
  </body>
</html>

<!doctype html>
<html lang="en" class="vfd-intro-pending">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Dimension Eight Labs builds open source software, firmware, and embedded systems.">
    <title>Dimension Eight Labs</title>
    <link rel="stylesheet" href="css/main.css">
    <script>
      window.setTimeout(() => {
        document.documentElement.classList.remove("vfd-intro-pending");
      }, 2000);
    </script>
    <noscript>
      <style>
        html.vfd-intro-pending main { visibility: visible; }
        .vfd-startup { display: none; }
      </style>
    </noscript>
    <script src="js/main.js" defer></script>
  </head>
  <body>
    <main>
      <figure class="logo-frame">
        <img
          class="logo"
          src="images/dim8-vfd-logo.png"
          alt="DIM8 vacuum fluorescent display logo"
        >
      </figure>
      <h1>Dimension Eight Labs</h1>
      <p>Open source software, firmware, and embedded systems.</p>
      <a
        class="github-link"
        href="https://github.com/Dimension-Eight-Labs"
        target="_blank"
        rel="noopener noreferrer"
      >GitHub →</a>
    </main>

    <div class="vfd-startup" data-vfd-startup>
      <div class="vfd-startup__display" aria-hidden="true">
        <div class="logo-frame vfd-startup__frame">
          <img class="logo vfd-startup__logo vfd-startup__logo--off" src="images/dim8-vfd-logo.png" alt="">
          <img class="logo vfd-startup__logo vfd-startup__logo--partial-a" src="images/dim8-vfd-logo.png" alt="">
          <img class="logo vfd-startup__logo vfd-startup__logo--partial-b" src="images/dim8-vfd-logo.png" alt="">
          <img class="logo vfd-startup__logo vfd-startup__logo--lit" src="images/dim8-vfd-logo.png" alt="">
          <img class="logo vfd-startup__logo vfd-startup__logo--mark" src="images/dim8-vfd-logo.png" alt="">
          <img class="logo vfd-startup__logo vfd-startup__logo--text" src="images/dim8-vfd-logo.png" alt="">
          <span class="vfd-startup__cursor" aria-hidden="true"></span>
          <div class="vfd-startup__heaters">
            <span></span>
            <span></span>
            <span></span>
          </div>
        </div>
      </div>
      <output class="vfd-startup__debug" data-vfd-startup-debug hidden>inactive</output>
      <button class="vfd-startup__skip" type="button" data-vfd-startup-skip>Skip</button>
    </div>
  </body>
</html>

<text x="38" y="34" class="cap">PRIMARY AUTHORITY PATH</text>
<rect x="38" y="72" width="298" height="255" rx="14" class="panel"/>
<text x="60" y="105" class="title">Absurdly Accurate Clock</text><text x="60" y="128" class="h2">Pico 2 / RP2350</text><text x="60" y="151" class="body">Sole external authoritative source</text>
<rect x="60" y="177" width="254" height="55" rx="8" class="sub"/><text x="76" y="198" class="h2">AAC Protocol v1 source</text><text x="76" y="217" class="mono">ACT1 · 40-byte immutable snapshot</text>
<rect x="60" y="245" width="254" height="58" rx="8" class="good"/><text x="76" y="267" class="h2">Qualified UTC/PPS boundary</text><text x="76" y="286" class="mono">UTC + PPS identity + TIME_SYNC association</text>
<path d="M336 145 C390 145 410 145 463 145" class="mutedline" marker-end="url(#arr-muted-clean)"/><text x="399.5" y="130" text-anchor="middle" class="gapmono">SPI clocks · dummy MOSI</text><text x="399.5" y="163" text-anchor="middle" class="gapsmall">ESP32 controller → Pico</text>

<path d="M336 269 C390 269 410 269 463 269" class="auth" marker-end="url(#arr-auth-clean)"/><text x="399.5" y="252" text-anchor="middle" class="gapmono">TIME_SYNC rising edge</text><text x="399.5" y="283" text-anchor="middle" class="gapsmall">software-delayed</text><text x="399.5" y="294" text-anchor="middle" class="gapsmall">boundary association</text>
<rect x="463" y="72" width="526" height="512" rx="16" class="panel"/>
<text x="489" y="105" class="title">AAC Time Bridge</text><text x="489" y="128" class="h2">ESP32 / NodeMCU-32S</text><text x="489" y="151" class="body">Network appliance · read-only consumer of AAC authority</text>
<rect x="489" y="179" width="210" height="88" rx="10" class="sub"/><text x="506" y="203" class="h2">1 · Protocol acquisition</text><text x="506" y="223" class="mono">SPI mode 1 · 100 kHz</text><text x="506" y="241" class="mono">magic/version/length/CRC</text><text x="506" y="257" class="mono">flags + sequences + epoch</text>
<rect x="728" y="179" width="233" height="88" rx="10" class="sub"/><text x="745" y="203" class="h2">2 · Edge association</text><text x="745" y="223" class="mono">capture TIME_SYNC edge</text><text x="745" y="241" class="mono">apply sync_delay_us relationship</text><text x="745" y="257" class="mono">pair edge ↔ snapshot boundary</text><path d="M699 223H728" class="auth" marker-end="url(#arr-auth-clean)"/>
<rect x="552" y="301" width="345" height="123" rx="11" class="good"/><text x="572" y="327" class="h2">3 · Qualification / authority state</text><text x="572" y="350" class="mono">UTC_VALID · PPS_PRESENT · PPS_LOCKED · SYNC_VALID</text><text x="572" y="371" class="mono">clean edge relationship · sequence continuity</text><text x="572" y="392" class="mono">freshness deadline: 1.5 s</text><text x="572" y="412" class="body">Responding is not the same as qualified.</text><path d="M594 267V301" class="auth" marker-end="url(#arr-auth-clean)"/><path d="M844 267V301" class="auth" marker-end="url(#arr-auth-clean)"/>
<rect x="489" y="454" width="222" height="100" rx="10" class="sub"/><text x="506" y="478" class="h2">Central appliance state</text><text x="506" y="498" class="mono">qualified UTC anchor</text><text x="506" y="516" class="mono">source / network / reset</text><text x="506" y="534" class="mono">watchdog / build / uptime</text>
<rect x="741" y="454" width="220" height="100" rx="10" class="sub"/><text x="758" y="478" class="h2">LAN NTP service</text><text x="758" y="498" class="mono">UDP/123 · NTP v3/v4</text><text x="758" y="516" class="mono">qualified: Stratum 1</text><text x="758" y="534" class="mono">Reference ID: “AAC ”</text><path d="M724 424V438H600V454" class="auth" marker-end="url(#arr-auth-clean)"/><path d="M711 504H741" class="auth" marker-end="url(#arr-auth-clean)"/><text x="726" y="490" text-anchor="middle" class="mono">qualified UTC</text>
<rect x="1080" y="123" width="260" height="182" rx="14" class="panel"/><text x="1102" y="155" class="title">Infrastructure LAN</text><text x="1102" y="180" class="body">Normal station Wi-Fi / LAN address</text><rect x="1102" y="202" width="216" height="77" rx="9" class="sub"/><text x="1120" y="226" class="h2">NTP clients</text><text x="1120" y="247" class="mono">workstations · servers · devices</text><text x="1120" y="265" class="mono">basic NTP v3/v4 requests</text><path d="M961 504 C1040 504 1030 241 1102 241" class="ntp" marker-end="url(#arr-ntp-clean)"/><text x="1033" y="370" text-anchor="middle" class="mono">NTP · UDP/123</text><text x="1033" y="388" text-anchor="middle" class="body">derived from qualified AAC clock state</text>
<rect x="1080" y="345" width="260" height="148" rx="14" class="panel"/><text x="1102" y="376" class="h2">Local WebUI / browser</text><text x="1102" y="399" class="body">Presentation + management client</text><text x="1102" y="424" class="mono">GET /telemetry ≈ 1×/s</text><text x="1102" y="444" class="mono">latest bounded snapshot only</text><text x="1102" y="466" class="body">Browser never becomes a clock authority.</text><path d="M711 524 C860 524 980 419 1080 419" class="ui" marker-end="url(#arr-ui-clean)"/>
<rect x="38" y="384" width="372" height="200" rx="14" class="warn"/><text x="60" y="416" class="title">Fail-safe: UNSYNCHRONIZED</text><text x="60" y="443" class="body">Authority is withdrawn on invalid, unqualified, stale,</text><text x="60" y="459" class="body">or discontinuous source state.</text><text x="60" y="483" class="mono">LI = 3</text><text x="140" y="483" class="mono">Stratum 16</text><text x="245" y="483" class="mono">Reference ID “INIT”</text><text x="60" y="507" class="mono">reference / receive / transmit timestamps = 0</text><text x="60" y="532" class="body">Wi-Fi, WebUI, watchdog and appliance execution continue.</text><text x="60" y="555" class="body">No Internet NTP, ESP32 wall clock, browser clock,</text><text x="60" y="573" class="body">stale-time or synthetic-authority fallback exists.</text><path d="M552 363 C470 363 448 440 410 440" class="cfg" marker-end="url(#arr-cfg-clean)"/><text x="468" y="400" text-anchor="middle" class="mono">qualification lost</text>
<rect x="1080" y="538" width="260" height="142" rx="14" class="panel"/><text x="1102" y="568" class="h2">Recovery / provisioning</text><text x="1102" y="592" class="mono">AAC-Bridge-XXXXXX</text><text x="1102" y="612" class="mono">192.168.4.1</text><text x="1102" y="637" class="body">Configuration and recovery only.</text><text x="1102" y="657" class="body">NTP is not exposed on the setup AP.</text><path d="M711 544 C875 560 982 608 1080 608" class="cfg" marker-end="url(#arr-cfg-clean)"/>
<rect x="463" y="628" width="526" height="116" rx="14" class="panel"/><text x="489" y="658" class="cap">SECONDARY APPLIANCE FUNCTIONS</text><rect x="489" y="677" width="225" height="46" rx="8" class="sub"/><text x="505" y="697" class="h2">30 s application watchdog</text><text x="505" y="714" class="body">Recovery not yet hardware bench-validated</text><rect x="739" y="677" width="222" height="46" rx="8" class="sub"/><text x="755" y="697" class="h2">GPIO16 status LED</text><text x="755" y="714" class="body">Consumes centralized appliance state</text>
<rect x="38" y="628" width="372" height="116" rx="14" class="panel"/><text x="60" y="658" class="cap">IMPLEMENTATION / VALIDATION</text><text x="60" y="684" class="body">SPI/TIME_SYNC acquisition: implemented + bench-confirmed</text><text x="60" y="704" class="body">Qualified AAC UTC + sequence/phase association: confirmed</text><text x="60" y="724" class="body">Absolute UTC error: not yet physically qualified</text>
